name: Update Pac-Man contribution graph

on:
  push:
    paths:
      - '.github/workflows/update-pacman.yml'
  workflow_dispatch: {}
  schedule:
    - cron: '0 6 * * *'

permissions:
  contents: write

jobs:
  build-and-commit:
    runs-on: ubuntu-latest
    env:
      USERNAME: Arnoldujr
      FILENAME: pacman-contribution-graph-dark.svg
      WIDTH: '1166'
      THEME: dark
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies (none)
        run: echo "No npm deps required"

      - name: Run generator
        run: node scripts/update_pacman.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ env.USERNAME }}
          FILENAME: ${{ env.FILENAME }}
          WIDTH: ${{ env.WIDTH }}
          THEME: ${{ env.THEME }}

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pacman-contribution-graph-dark.svg README.md || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update Pac-Man contribution graph (automated)"
            git push
          fi
