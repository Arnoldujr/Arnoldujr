<svg xmlns="http://www.w3.org/2000/svg" width="852" height="132" viewBox="0 0 852 132" role="img" aria-labelledby="title">
  <title id="title">52-week contribution snake animation</title>
  <defs>
    <style>
      .cell { rx: 2; ry: 2; fill: #ebedf0; }
    </style>
  </defs>

  <!-- Grid background using explicit rects so each cell can animate -->
  <!-- Grid origin at (10,10). cell size = 12, gap = 4, step = 16 -->
  <g id="grid" transform="translate(10,10)">
